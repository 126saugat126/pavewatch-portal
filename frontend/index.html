<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PaveWatch survey portal: pavement defects found by drone surveys." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PaveWatch</title>
    <script>
      // Apply the saved colour scheme before first paint (light by default) to avoid a flash.
      try {
        var s = localStorage.getItem('mantine-color-scheme-value');
        var dark = s === 'dark' || (s === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-mantine-color-scheme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
